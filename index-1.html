<script>
  /* Part 1: watches the app's own saves to localStorage (no change to app behaviour) */
  (function () {
    var KEYS = ['father_patient_info', 'father_vitals_history', 'father_appointments', 'father_reports', 'father_medicines'];
    var orig = Storage.prototype.setItem;
    window.__sync = {
      KEYS: KEYS,
      onWrite: null,
      rawSet: function (k, v) { orig.call(window.localStorage, k, v); }
    };
    Storage.prototype.setItem = function (k, v) {
      orig.call(this, k, v);
      if (this === window.localStorage && KEYS.indexOf(k) > -1 && window.__sync.onWrite) {
        window.__sync.onWrite(k, String(v));
      }
    };
  })();
</script>

<script type="module">
  /* Part 2: Firebase login + real-time sync */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, onSnapshot, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // >>> PASTE YOUR FIREBASE CONFIG VALUES HERE <<<
  const firebaseConfig = {
    apiKey: "AIzaSyA5XDoKay7Xo4zhivBuBeDqo_UJGfJGCk4",
    authDomain: "medisync-001.firebaseapp.com",
    projectId: "medisync-001",
    storageBucket: "medisync-001.firebasestorage.app",
    messagingSenderId: "484030948860",
    appId: "1:484030948860:web:24f8a672d78e173548be79"
  };

  const S = window.__sync, KEYS = S.KEYS;
  const root = document.getElementById('root');
  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = initializeFirestore(fbApp, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
  const ref = doc(db, 'tracker', 'data');

  /* ---------- report attachments (one small document per file) ---------- */
  window.__attach = {
    save: function (id, p) {
      const w = setDoc(doc(db, 'attachments', id), { data: p.dataUrl, name: p.name, type: p.type, updatedAt: Date.now() });
      return Promise.race([w, new Promise(function (r) { setTimeout(r, 8000); })]); // offline: queued, continue
    },
    remove: function (id) { return deleteDoc(doc(db, 'attachments', id)).catch(function () {}); },
    open: async function (id) {
      const win = window.open('', '_blank');
      try {
        const snap = await getDoc(doc(db, 'attachments', id));
        if (!snap.exists()) throw new Error('missing');
        const d = snap.data();
        const bin = atob(d.data.split(',')[1]);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([arr], { type: d.type }));
        if (win) win.location.href = url; else window.location.href = url;
      } catch (e) {
        if (win) win.close();
        alert('Could not open this file. Please check your internet connection and try again.');
      }
    }
  };

  let unsub = null, ready = false, timer = null;
  const cloud = {};
  const dirty = new Set();

  /* ---------- small UI: login screen + status pill ---------- */
  const inp = 'width:100%;box-sizing:border-box;padding:10px;margin-bottom:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px';
  const login = document.createElement('div');
  login.style.cssText = 'position:fixed;inset:0;z-index:100;background:#0f172a;display:none;align-items:center;justify-content:center;padding:16px';
  login.innerHTML =
    '<form style="background:#fff;border-radius:16px;padding:24px;width:100%;max-width:360px;font-family:inherit">' +
    '<h2 style="font-size:18px;font-weight:700;margin:0 0 4px">Care Tracker</h2>' +
    '<p style="font-size:12px;color:#64748b;margin:0 0 16px">Sign in to open the shared records.</p>' +
    '<input type="email" placeholder="Email" autocomplete="username" required style="' + inp + '">' +
    '<input type="password" placeholder="Password" autocomplete="current-password" required style="' + inp + '">' +
    '<div style="color:#e11d48;font-size:12px;min-height:16px;margin-bottom:8px"></div>' +
    '<button type="submit" style="width:100%;padding:10px;border:0;border-radius:8px;background:#0d9488;color:#fff;font-weight:700;font-size:14px;cursor:pointer">Sign in</button>' +
    '</form>';
  document.body.appendChild(login);
  const form = login.querySelector('form');
  const [emailEl, passEl] = form.querySelectorAll('input');
  const errEl = form.querySelector('div');
  const btnEl = form.querySelector('button');

  const pill = document.createElement('div');
  pill.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:40;display:none;align-items:center;gap:8px;background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600;color:#334155;box-shadow:0 1px 4px rgba(0,0,0,.12)';
  pill.innerHTML = '<span>●</span><span></span><button style="border:0;background:none;color:#64748b;font-size:11px;text-decoration:underline;cursor:pointer">Sign out</button>';
  document.body.appendChild(pill);
  const dotEl = pill.children[0], txtEl = pill.children[1], outEl = pill.children[2];

  function setStatus() {
    let c, t;
    if (!navigator.onLine) { c = '#94a3b8'; t = 'Offline - will sync later'; }
    else if (dirty.size) { c = '#f59e0b'; t = 'Syncing...'; }
    else { c = '#10b981'; t = 'Synced'; }
    dotEl.style.color = c;
    txtEl.textContent = t;
  }
  window.addEventListener('online', setStatus);
  window.addEventListener('offline', setStatus);

  function reveal() {
    root.style.visibility = 'visible';
    pill.style.display = 'flex';
    setStatus();
  }

  /* ---------- push local changes to the cloud ---------- */
  function push() {
    const keys = Array.from(dirty);
    if (!keys.length) { setStatus(); return; }
    const data = { updatedAt: Date.now() };
    keys.forEach(k => { data[k] = localStorage.getItem(k); });
    setStatus();
    setDoc(ref, data, { merge: true }).then(() => {
      keys.forEach(k => {
        if (localStorage.getItem(k) === data[k]) { dirty.delete(k); cloud[k] = data[k]; }
      });
      setStatus();
    }).catch(e => {
      console.error('Sync failed', e);
      clearTimeout(timer);
      timer = setTimeout(push, 10000);
      setStatus();
    });
  }

  S.onWrite = function (k, v) {
    if (!ready || cloud[k] === v) return;
    dirty.add(k);
    setStatus();
    clearTimeout(timer);
    timer = setTimeout(push, 700);
  };

  /* ---------- apply cloud changes to this device ---------- */
  function reloadSoon() {
    const last = Number(sessionStorage.getItem('sync_reload') || 0);
    if (Date.now() - last < 5000) { // loop guard
      if (!ready) { ready = true; reveal(); }
      return;
    }
    const go = () => {
      if (document.querySelector('.fixed.inset-0')) { setTimeout(go, 2000); return; } // wait while a form is open
      sessionStorage.setItem('sync_reload', String(Date.now()));
      location.reload();
    };
    go();
  }

  function startSync() {
    unsub = onSnapshot(ref, snap => {
      if (!snap.exists() && snap.metadata.fromCache) return; // wait for the server before seeding
      const d = snap.exists() ? snap.data() : {};
      let changed = false;
      KEYS.forEach(k => {
        if (typeof d[k] !== 'string') return;
        cloud[k] = d[k];
        if (dirty.has(k)) return;
        if (localStorage.getItem(k) !== d[k]) { S.rawSet(k, d[k]); changed = true; }
      });
      if (changed) { reloadSoon(); return; }
      if (!ready) {
        ready = true;
        // first ever sign-in: upload whatever this device has
        KEYS.forEach(k => {
          if (typeof d[k] !== 'string' && localStorage.getItem(k) !== null) dirty.add(k);
        });
        if (dirty.size) push();
        reveal();
      }
      setStatus();
    }, err => {
      console.error(err);
      if (err && err.code === 'permission-denied') {
        errEl.textContent = 'This account is not allowed to open the tracker.';
        signOut(auth);
      }
    });
  }

  /* ---------- login / logout ---------- */
  form.addEventListener('submit', e => {
    e.preventDefault();
    errEl.textContent = '';
    btnEl.disabled = true;
    signInWithEmailAndPassword(auth, emailEl.value.trim(), passEl.value)
      .catch(ex => {
        errEl.textContent = ex.code === 'auth/network-request-failed' ? 'No internet connection.' : 'Wrong email or password.';
      })
      .finally(() => { btnEl.disabled = false; });
  });

  outEl.addEventListener('click', () => {
    signOut(auth).then(() => {
      KEYS.forEach(k => localStorage.removeItem(k)); // no medical data left on a signed-out device
      location.reload();
    });
  });

  onAuthStateChanged(auth, user => {
    if (!user) {
      if (unsub) { unsub(); unsub = null; }
      ready = false;
      dirty.clear();
      Object.keys(cloud).forEach(k => delete cloud[k]);
      root.style.visibility = 'hidden';
      pill.style.display = 'none';
      login.style.display = 'flex';
    } else {
      login.style.display = 'none';
      if (!unsub) startSync();
    }
  });
</script>
<!-- ===== CLOUD SYNC ADD-ON END ===== -->

                maximumFractionDigits: 0
            }).format(val || 0);
        };

        const MAX_ATTACH_CHARS = 850000;
        const prepareAttachment = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('Could not read the file.'));
            reader.onload = () => {
                const dataUrl = reader.result;
                if (file.type === 'application/pdf') {
                    if (dataUrl.length > MAX_ATTACH_CHARS) return reject(new Error('This PDF is too large (limit about 600 KB). Please attach a photo of the report instead.'));
                    return resolve({ dataUrl, name: file.name, type: file.type });
                }
                if (!file.type.startsWith('image/')) return reject(new Error('Please choose a photo or a PDF.'));
                const img = new Image();
                img.onerror = () => reject(new Error('Could not open this image.'));
                img.onload = () => {
                    let maxSide = 1600, quality = 0.75, out = '';
                    for (let i = 0; i < 8; i++) {
                        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.width * scale);
                        c.height = Math.round(img.height * scale);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        out = c.toDataURL('image/jpeg', quality);
                        if (out.length <= MAX_ATTACH_CHARS) break;
                        maxSide = Math.round(maxSide * 0.8);
                        quality = Math.max(0.4, quality - 0.08);
                    }
                    if (out.length > MAX_ATTACH_CHARS) return reject(new Error('Image is still too large. Try a smaller photo.'));
                    resolve({ dataUrl: out, name: file.name.replace(/\.[^.]+$/, '') + '.jpg', type: 'image/jpeg' });
                };
                img.src = dataUrl;
            };
            reader.readAsDataURL(file);
        });

        const parseReminderTimes = (str) => (String(str || '').match(/\d{1,2}:\d{2}\s*(?:AM|PM)?/gi) || []).map(t => {
            const m = t.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
            let h = Number(m[1]);
            const mi = Number(m[2]);
            const ap = m[3] && m[3].toUpperCase();
            if (ap === 'PM' && h < 12) h += 12;
            if (ap === 'AM' && h === 12) h = 0;
            if (h > 23 || mi > 59) return null;
            return { h, mi };

                                    className="w-full p-2.5 text-sm font-semibold border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500 bg-white">
                                    <option value="Appointment">🩺 Doctor Appointment</option>
                                    <option value="Admission">🏥 Hospital Admission</option>
                                </select>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Date</label>
                                    <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                                        {type === 'Admission' ? 'Admission Charges (₹)' : 'Doctor Fees (₹)'}
                                    </label>
                                    <input type="number" placeholder="1500" value={fees} onChange={(e) => setFees(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Doctor / Specialist Name</label>
                                <input type="text" placeholder="Dr. S. K. Sharma" value={drName} onChange={(e) => setDrName(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Specialty</label>
                                    <input type="text" placeholder="Cardiologist" value={specialty} onChange={(e) => setSpecialty(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Hospital / Clinic Name</label>
                                    <input type="text" placeholder="Apollo Hospital" value={hospitalName} onChange={(e) => setHospitalName(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Paid By Column</label>
                                    <input type="text" placeholder="Self / Son / Daughter" value={paidBy} onChange={(e) => setPaidBy(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Insurance / Self</label>
                                    <select value={claimType} onChange={(e) => setClaimType(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500">
                                        <option value="Paid by Self">Paid by Self</option>
                                        <option value="Insurance">Will be claimed in Insurance</option>
                                    </select>
                                </div>
                            </div>
                            {claimType === 'Insurance' && (
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Insurance Claim Status</label>
                                    <select value={insuranceStatus} onChange={(e) => setInsuranceStatus(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500">
                                        <option value="Pending Claim">Pending Claim</option>
                                        <option value="Pre-approved Claim Done">Pre-approved Claim Done</option>
                                        <option value="Claim Under Process">Claim Under Process</option>
                                        <option value="Claim Credited">Claim Credited</option>
                                    </select>
                                </div>
                            )}
                            <div className="flex justify-end gap-2 pt-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                                <button type="submit" className="px-4 py-2 text-sm bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-lg shadow">Save Record</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ModalFormReport({ item, onClose, onSave }) {
            const [date, setDate] = useState(item?.date || new Date().toISOString().split('T')[0]);
            const [reportName, setReportName] = useState(item?.reportName || '');
            const [details, setDetails] = useState(item?.details || '');
            const [cost, setCost] = useState(item?.cost || '');
            const [paidBy, setPaidBy] = useState(item?.paidBy || 'Self');
            const [claimType, setClaimType] = useState(item?.claimType || 'Paid by Self');
            const [insuranceStatus, setInsuranceStatus] = useState(item?.insuranceStatus || 'Pending Claim');
            const [fileName, setFileName] = useState(item?.fileUrl || '');
            const [picked, setPicked] = useState(null);
            const [busy, setBusy] = useState(false);
            const [err, setErr] = useState('');

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-200">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold text-slate-900">{item ? 'Edit Report' : 'Save / Upload Report & Prescription'}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            setErr('');
                            let fid = item?.fileId || '';
                            let ftype = item?.fileType || '';
                            if (picked) {
                                try {
                                    setBusy(true);
                                    const id = 'att-' + Date.now();
                                    await window.__attach.save(id, picked);
                                    if (item?.fileId) window.__attach.remove(item.fileId);
                                    fid = id;
                                    ftype = picked.type;
                                } catch (ex) {
                                    setBusy(false);
                                    setErr('Could not upload the file. Please check your internet and try again.');
                                    return;
                                }
                            }
                            onSave({ date, reportName, details, cost: Number(cost), paidBy, claimType, insuranceStatus, fileUrl: fileName, fileId: fid, fileType: ftype });
                        }} className="space-y-4">
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Date</label>
                                    <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Cost / Fee (₹)</label>
                                    <input type="number" placeholder="2500" value={cost} onChange={(e) => setCost(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Report / Prescription Name</label>
                                <input type="text" placeholder="MRI Knee Scan / Blood Report" value={reportName} onChange={(e) => setReportName(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Details Section</label>
                                <textarea rows="2" placeholder="Summary of findings, doctor recommendations..." value={details} onChange={(e) => setDetails(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500"></textarea>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Upload File / Report Attachment Name</label>
                                <input type="text" placeholder="Report_Oct2026.pdf or scan photo name" value={fileName} onChange={(e) => setFileName(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" />
                                <div className="mt-2">
                                    <label className="inline-flex items-center gap-2 px-3 py-2 text-xs font-semibold bg-teal-50 text-teal-700 border border-teal-200 rounded-lg cursor-pointer hover:bg-teal-100">
                                        <i className="fa-solid fa-paperclip"></i> {(picked || item?.fileId) ? 'Replace photo / PDF' : 'Attach photo / PDF'}
                                        <input type="file" accept="image/*,application/pdf" className="hidden" onChange={async (e) => {
                                            const f = e.target.files && e.target.files[0];
                                            e.target.value = '';
                                            if (!f) return;
                                            setErr('');
                                            try {
                                                const p = await prepareAttachment(f);
                                                setPicked(p);
                                                if (!fileName) setFileName(p.name);
                                            } catch (ex) { setErr(ex.message); }
                                        }} />
                                    </label>
                                    {picked && <span className="ml-2 text-xs text-emerald-600">Ready: {picked.name} ({Math.round(picked.dataUrl.length * 0.75 / 1024)} KB)</span>}
                                    {!picked && item?.fileId && <span className="ml-2 text-xs text-slate-500">File already attached</span>}
                                    {err && <div className="text-xs text-rose-600 mt-1">{err}</div>}
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Paid By Column</label>
                                    <input type="text" placeholder="Self / Son" value={paidBy} onChange={(e) => setPaidBy(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Insurance / Self</label>
                                    <select value={claimType} onChange={(e) => setClaimType(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500">
                                        <option value="Paid by Self">Paid by Self</option>
                                        <option value="Insurance">Will be claimed in Insurance</option>
                                    </select>
                                </div>
                            </div>
                            {claimType === 'Insurance' && (
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Insurance Claim Status</label>
                                    <select value={insuranceStatus} onChange={(e) => setInsuranceStatus(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500">
                                        <option value="Pending Claim">Pending Claim</option>
                                        <option value="Pre-approved Claim Done">Pre-approved Claim Done</option>
                                        <option value="Claim Under Process">Claim Under Process</option>
                                        <option value="Claim Credited">Claim Credited</option>
                                    </select>
                                </div>
                            )}
                            <div className="flex justify-end gap-2 pt-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                                <button type="submit" disabled={busy} className="px-4 py-2 text-sm bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-lg shadow disabled:opacity-60">{busy ? 'Uploading...' : 'Save Report'}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ModalFormMedicine({ item, onClose, onSave }) {
            const [name, setName] = useState(item?.name || '');
            const [dosage, setDosage] = useState(item?.dosage || '1 Tablet');
            const [timing, setTiming] = useState(item?.timing || 'Morning & Evening');
            const [reminderTime, setReminderTime] = useState(item?.reminderTime || '08:00, 20:00');
            const [cost, setCost] = useState(item?.cost || '');
            const [paidBy, setPaidBy] = useState(item?.paidBy || 'Self');
            const [claimType, setClaimType] = useState(item?.claimType || 'Paid by Self');
            const [insuranceStatus, setInsuranceStatus] = useState(item?.insuranceStatus || 'Pending Claim');

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-200">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold text-slate-900">{item ? 'Edit Medicine' : 'Add Medicine & Timings'}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={(e) => { e.preventDefault(); onSave({ name, dosage, timing, reminderTime, cost: Number(cost), paidBy, claimType, insuranceStatus, reminderActive: true }); }} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Medicine Name</label>
                                <input type="text" placeholder="Glycomet 500mg" value={name} onChange={(e) => setName(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Dosage</label>
                                    <input type="text" placeholder="1 Tablet / 5ml" value={dosage} onChange={(e) => setDosage(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Monthly Cost (₹)</label>
                                    <input type="number" placeholder="500" value={cost} onChange={(e) => setCost(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Schedule / Time to Take</label>
                                <input type="text" placeholder="Morning after food, Night before bed" value={timing} onChange={(e) => setTiming(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Reminder Alarm Times</label>
                                <input type="text" placeholder="08:00, 20:00" value={reminderTime} onChange={(e) => setReminderTime(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Paid By Column</label>
                                    <input type="text" placeholder="Self / Son" value={paidBy} onChange={(e) => setPaidBy(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Insurance / Self</label>
                                    <select value={claimType} onChange={(e) => setClaimType(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500">
                                        <option value="Paid by Self">Paid by Self</option>
                                        <option value="Insurance">Will be claimed in Insurance</option>
                                    </select>
                                </div>
                            </div>
                            {claimType === 'Insurance' && (
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Insurance Claim Status</label>
                                    <select value={insuranceStatus} onChange={(e) => setInsuranceStatus(e.target.value)} className="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500">
                                        <option value="Pending Claim">Pending Claim</option>
                                        <option value="Pre-approved Claim Done">Pre-approved Claim Done</option>
                                        <option value="Claim Under Process">Claim Under Process</option>
                                        <option value="Claim Credited">Claim Credited</option>
                                    </select>
                                </div>
                            )}
                            <div className="flex justify-end gap-2 pt-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                                <button type="submit" className="px-4 py-2 text-sm bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-lg shadow">Save Medicine</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
